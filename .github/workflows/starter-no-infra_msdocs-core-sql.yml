name: Build and deploy ASP.Net Core app to Azure Web App - msdocs-core-sql

on:
  push:
    branches:
      - starter-no-infra
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build with dotnet
        run: dotnet build --configuration Release

      # 1. Install dotnet-ef tool globally
      - name: Install dotnet ef
        run: dotnet tool install --global dotnet-ef --version 8.*

      # 2. Add the .NET tools path to the system PATH
      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      # 3. (Optional) Verify dotnet ef installation
      - name: Verify dotnet-ef installation
        run: dotnet ef --version

      # 4. Create migrations bundle
      - name: Create migrations bundle
        run: |
          # If your project file is not in the root, cd to the correct directory:
          # cd <your-project-folder>
          dotnet ef migrations bundle --runtime linux-x64 -o ${{ env.DOTNET_ROOT }}/myapp/migrationsbundle

      - name: Publish
        run: dotnet publish -c Release -o ${{ env.DOTNET_ROOT }}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.DOTNET_ROOT }}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write # Required for azure/login
      contents: read  # Required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_90DED59D9DBF4E97AEEA047F66F64543 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DC1005F7766D4F11837B275D413E099C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_93F5A22A3AA94E9E9AC04304C65987FA }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'msdocs-core-sql'
          slot-name: 'Production'
          package: .